{% extends 'master/master.html' %}

{% load static %}

{% block title %}
    <title>Edit Advertising Space</title>
{% endblock title %}

{% block content %}
    <div class="container mt-4">
        <h1>Edit Advertising Space</h1>
        <form method="post" action="{% url 'edit_advertising_space' advertising_space.id %}">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-outline-primary">Update</button>
                <button type="button" onclick="history.back()" class="btn btn-outline-success">Back</button>
            </div>
        </form>
    </div>
{% endblock content %}
