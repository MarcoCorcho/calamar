{% extends 'master/master.html' %}

{% load static %}

{% block title %}
    <title>Edit Account Type</title>
{% endblock title %}

{% block content %}
    <div class="container mt-4">
        <h1>Edit Account Type</h1>
        <form method="post" action="{% url 'edit_account_type' account_type.id %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Update</button>            
        </form>
        <button type="button" onclick="history.back()" class="btn btn-success">Back</button>
    </div>
{% endblock content %}
