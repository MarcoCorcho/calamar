{% extends 'master/master.html' %}

{% load static %}

{% block title %}
    <title>Edit Catalog</title>
{% endblock title %}

{% block content %}
    <div class="container mt-4">
        <h1>Edit Catalog</h1>
        <form method="post" action="{% url 'edit_catalog' catalog.id %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-outline-primary">Update</button>            
        </form>
        <button type="button" onclick="history.back()" class="btn btn-outline-success">Back</button>
    </div>
{% endblock content %}
